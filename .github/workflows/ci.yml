name: CI Pipeline - Log Analyzer

on:
  push:
    branches: [ "main", "master", "*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: | 
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          pip install httpx2

      - name: Run Unit Test
        run: pytest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: log-analyzer-api:latest
          load: true

      - name: Run Container & Test Endpoint
        run: |
          echo "Starting container for integration testing..."
          docker run -d -p 8000:8000 --name test_api log-analyzer-api:latest
          
          # Give Uvicorn a few seconds to boot up
          sleep 3
          
          echo "Testing /api/metrics endpoint..."
          curl --retry 3 --retry-delay 2 --retry-connrefused http://localhost:8000/api/metrics
          
          echo "Cleaning up test container..."
          docker stop test_api
          docker rm test_api