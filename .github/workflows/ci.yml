name: CI Pipeline - Log Analyzer

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: | 
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          pip install httpx

      - name: Run Unit Test
        run: pytest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: log-analyzer-api:latest
          load: true

      - name: Run Container & Test Endpoint
        run: |
          echo "Starting container for integration testing..."
          docker run -d -p 8000:8000 --name test_api log-analyzer-api:latest
          
          # Give Uvicorn a few seconds to boot up
          sleep 3
          
          echo "Testing /api/metrics endpoint..."
          curl --retry 3 --retry-delay 2 --retry-connrefused http://localhost:8000/api/metrics
          
          echo "Cleaning up test container..."
          docker stop test_api
          docker rm test_api

      # ==========================================
      # NEW: CD / PUSH STEPS (Runs only if tests pass!)
      # ==========================================
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Tag and Push to Docker Hub
        if: github.event_name != 'pull_request'
        run: |
          # Tag your local image with your Docker Hub username repository format
          docker tag log-analyzer-api:latest ${{ secrets.DOCKER_HUB_USERNAME }}/log-analyzer-api:latest
          
          # Push it up to the registry
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/log-analyzer-api:latest