version: '3.8'
services:
  api:
   build: .
   container_name: log_analyzer_api
   ports:
     - "8000:8000"
   volumes:
       - .:/app
   restart: always

  frontend:
   image: nginx:alpine
   container_name: log_analyzer_frontend
   ports:
     - "8080:80"
   volumes:
    - ./frontend:/usr/share/nginx/html:ro
    - ./frontend/default.conf:/etc/nginx/conf.d/default.conf:ro
     
   restart: always